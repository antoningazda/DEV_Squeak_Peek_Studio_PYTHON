[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "squeak-peek-studio"
dynamic = ["version"]
description = "Visualization, segmentation and sonification of ultrasonic rodent vocalizations"
authors = [{ name = "Antonín Gazda", email = "antonin.gazda@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # ── Core numerics ─────────────────────────────────────────────────────
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "numba>=0.59",               # JIT for per-sample recursive detectors (BSCD/RBD)

    # ── Audio ─────────────────────────────────────────────────────────────
    "soundfile>=0.12",          # WAV I/O (250 kHz, float32)
    "librosa>=0.10",            # STFT for sonification
    "soxr>=0.3",                # fractional-rate resampling for sonification
    "sounddevice>=0.4",         # real-time playback

    # ── Machine Learning ──────────────────────────────────────────────────
    "scikit-learn>=1.4",
    "joblib>=1.3",              # model serialization

    # ── Configuration ─────────────────────────────────────────────────────
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # ── GUI ───────────────────────────────────────────────────────────────
    "PyQt6>=6.6,<6.8",        # 6.8+ breaks cocoa plugin on macOS 26 (QtMultimedia is bundled in)
    "pyqtgraph>=0.13",          # GPU-accelerated spectrogram
    "matplotlib>=3.8",          # Standard colormaps (parula, turbo already hardcoded)

    # ── Video (import / sync / export) ──────────────────────────────────────
    "imageio-ffmpeg>=0.5",      # bundled static ffmpeg binary — audio extraction + muxing

    # ── Hyperparameter optimisation ───────────────────────────────────────
    "optuna>=3.5",

    # ── CLI ───────────────────────────────────────────────────────────────
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
]
package = [
    "pyinstaller>=6.0",
]

[project.scripts]
squeak-peek     = "squeak_peek.gui.app:main"
squeak-peek-cli = "cli.main:cli"

# ── Setuptools source layout ───────────────────────────────────────────────
# squeak_peek lives under src/ (src layout); cli is a separate top-level
# package (the squeak-peek-cli console script) — merge both package roots.
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["squeak_peek*", "cli*"]

# squeak_peek.__version__ is the single source of truth for the app's
# version (read at runtime by the Info tab and the CLI too) — pyproject.toml
# just mirrors it here instead of duplicating the number.
[tool.setuptools.dynamic]
version = { attr = "squeak_peek.__version__" }

# ── Pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

# ── Coverage ──────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["squeak_peek"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# ── Mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict         = false
ignore_missing_imports = true
