site_name: Squeak Peek Studio
site_description: >-
  Visualization, segmentation, classification and sonification of ultrasonic
  vocalizations (USVs) of laboratory rodents.
site_author: Antonín Gazda
site_url: https://antoningazda.github.io/squeak-peek-studio-releases/

# The docs source lives in the main (code) repo so it cannot drift from the
# software it describes; CI publishes the built site to the public releases
# repo, which is where users already go for the installers.
repo_url: https://github.com/antoningazda/DEV_Squeak_Peek_Studio_PYTHON
repo_name: Squeak-Peek-Studio
edit_uri: edit/main/docs/

copyright: >-
  © Antonín Gazda · MIT licensed ·
  National Institute of Mental Health (NUDZ) &
  CTU Prague, Faculty of Electrical Engineering (FEL)

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/antoningazda/DEV_Squeak_Peek_Studio_PYTHON
      name: Source code on GitHub
    - icon: fontawesome/solid/download
      link: https://github.com/antoningazda/squeak-peek-studio-releases/releases/latest
      name: Download the latest release
    - icon: fontawesome/solid/envelope
      link: mailto:antonin.gazda@gmail.com
      name: Email the author

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - User guide:
      - guide/index.md
      - Data Input: guide/data-input.md
      - Visualization: guide/visualization.md
      - Detection: guide/detection.md
      - Classification: guide/classification.md
      - Label Edit: guide/label-edit.md
      - Video: guide/video.md
      - Metrics: guide/metrics.md
      - Settings: guide/settings.md
      - Keyboard shortcuts: guide/shortcuts.md
  - Methods: methods.md
  - Training models: training.md
  - CLI reference: cli.md
  - File formats: file-formats.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
