name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: SqueakPeekStudio-macOS
          - os: windows-latest
            asset_name: SqueakPeekStudio-windows
          - os: ubuntu-latest
            asset_name: SqueakPeekStudio-linux

    # Signing credentials are read at job level rather than per step because
    # GitHub only exposes the `env` context to a step's own `if:` when it is
    # defined here — that is what lets every signing step below degrade to a
    # no-op when the corresponding secrets are absent. With none of these set
    # the workflow produces exactly what it did before: an ad-hoc-signed .app
    # and an unsigned installer.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      # PyPI's Linux torch wheels pull in ~3 GB of CUDA libraries, which
      # pushes the archive past GitHub's 2 GB release-asset limit. Install
      # the CPU-only build first so `pip install -e .` finds it satisfied.
      - name: Install CPU-only torch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + PyInstaller
        run: |
          pip install -e .
          pip install "pyinstaller>=6.0"

      - name: Build
        run: pyinstaller packaging/SqueakPeekStudio.spec --noconfirm

      # ── macOS signing ───────────────────────────────────────────────────
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # A dedicated throwaway keychain, not the login keychain: it is
          # unlocked for this job only and deleted in the cleanup step.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Without this, codesign blocks on an interactive "allow access to
          # key?" prompt that no one can answer on a CI runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign app bundle (macOS)
        if: runner.os == 'macOS'
        run: packaging/sign_macos.sh "dist/Squeak Peek Studio.app"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_STAGE="$(mktemp -d)"
          cp -R "dist/Squeak Peek Studio.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          # Keep Spotlight off the staging tree and the image hdiutil mounts
          # from it: an indexer holding either one open is what makes
          # hdiutil fail with "Resource busy".
          touch "$DMG_STAGE/.metadata_never_index"
          sync
          # Even so, hdiutil intermittently loses the race on hosted runners
          # (v0.1.0's first attempt died here). Retry rather than fail a
          # release over a transient lock.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Squeak Peek Studio" -srcfolder "$DMG_STAGE" \
                 -ov -format UDZO "${{ matrix.asset_name }}.dmg"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::hdiutil create failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::hdiutil create failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          rm -rf "$DMG_STAGE"

      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS'
        run: packaging/notarize_macos.sh "${{ matrix.asset_name }}.dmg"

      - name: Clean up keychain (macOS)
        if: always() && runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          security list-keychain -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # ── Windows signing ─────────────────────────────────────────────────
      # The payload .exe is signed before it is zipped or fed to Inno Setup,
      # so both the portable zip and the installed program carry the
      # signature; the installer itself is signed after it is built. Bundled
      # DLLs/PYDs are left unsigned deliberately — SmartScreen judges the
      # installer and the launched .exe, and timestamping ~400 extra files
      # adds a server round-trip each for no user-visible gain.
      - name: Sign application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/sign_windows.ps1 dist/SqueakPeekStudio/SqueakPeekStudio.exe

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: dist
        run: Compress-Archive -Path SqueakPeekStudio -DestinationPath "../${{ matrix.asset_name }}.zip"

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "0.0.0" }
          choco install -y innosetup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\installer.iss
          Move-Item "packaging\installer_output\SqueakPeekStudio-Setup.exe" "${{ matrix.asset_name }}-Setup.exe"

      - name: Sign installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/sign_windows.ps1 "${{ matrix.asset_name }}-Setup.exe"

      # ── Linux ───────────────────────────────────────────────────────────
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        working-directory: dist
        run: tar -czf "../${{ matrix.asset_name }}.tar.gz" SqueakPeekStudio

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.dmg
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}-Setup.exe
          if-no-files-found: ignore

  release:
    name: Publish release to public repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract CHANGELOG section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "(No changelog entry for ${GITHUB_REF_NAME} — see CHANGELOG.md.)" > release_notes.md
          fi

      - name: Push release to public repo
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          repository: antoningazda/squeak-peek-studio-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          body_path: release_notes.md
          # Auto-generated notes need PR/commit read access the fine-grained
          # PAT doesn't have (it's scoped to Contents only); use our own
          # CHANGELOG.md section instead.
          generate_release_notes: false
