name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: SqueakPeekStudio-macOS
          - os: windows-latest
            asset_name: SqueakPeekStudio-windows
          - os: ubuntu-latest
            asset_name: SqueakPeekStudio-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install package + PyInstaller
        run: |
          pip install -e .
          pip install "pyinstaller>=6.0"

      - name: Build
        run: pyinstaller packaging/SqueakPeekStudio.spec --noconfirm

      - name: Re-sign app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr "dist/Squeak Peek Studio.app"
          codesign -s - --force --deep --timestamp "dist/Squeak Peek Studio.app"

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG_STAGE="$(mktemp -d)"
          cp -R "dist/Squeak Peek Studio.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Squeak Peek Studio" -srcfolder "$DMG_STAGE" -ov -format UDZO "${{ matrix.asset_name }}.dmg"
          rm -rf "$DMG_STAGE"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: dist
        run: Compress-Archive -Path SqueakPeekStudio -DestinationPath "../${{ matrix.asset_name }}.zip"

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { $ver = "0.0.0" }
          choco install -y innosetup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\installer.iss
          Move-Item "packaging\installer_output\SqueakPeekStudio-Setup.exe" "${{ matrix.asset_name }}-Setup.exe"

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        working-directory: dist
        run: tar -czf "../${{ matrix.asset_name }}.tar.gz" SqueakPeekStudio

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.dmg
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}-Setup.exe
          if-no-files-found: ignore

  release:
    name: Publish release to public repo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Push release to public repo
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          repository: antoningazda/squeak-peek-studio-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          generate_release_notes: true
